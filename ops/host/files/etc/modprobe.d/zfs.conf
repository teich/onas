# Managed in onas ops/host. After changing, run `update-initramfs -u -k all` (this file is
# copied into the initramfs) or set the same values live under /sys/module/zfs/parameters.
#
# ARC 12 GiB (was 6 GiB, 10% of RAM). dnode limit 25% of ARC (default 10%): walking millions
# of files for the offsite backup pushed dnodes past the 10% limit and arc_prune spun on a core.
options zfs zfs_arc_max=12884901888 zfs_arc_dnode_limit_percent=25
