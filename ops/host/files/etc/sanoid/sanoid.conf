# Managed in onas ops/host. Automatic ZFS snapshots of the data that guest backups skip
# (bind mounts). Until the B2 upload is done these are its only protection beyond RAIDZ2.
# sanoid.timer runs every 15 minutes; it only creates and prunes autosnap_* snapshots.
# Not recursive: child datasets (bulk/backups/pbs) are left alone.

[bulk/photos]
	use_template = data
[bulk/videos]
	use_template = data
[fast/apps]
	use_template = data
[bulk/backups]
	use_template = archive

# Hourly for a day, daily for two weeks, monthly for half a year.
[template_data]
	hourly = 24
	daily = 14
	weekly = 0
	monthly = 6
	yearly = 0
	autosnap = yes
	autoprune = yes

# Old machine backups and AAC files change rarely: daily and monthly are enough.
[template_archive]
	hourly = 0
	daily = 14
	weekly = 0
	monthly = 6
	yearly = 0
	autosnap = yes
	autoprune = yes
